<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Minimalist Playlist - Tab Version</title>
<style>
* { box-sizing: border-box; }
body { 
    background: #f8f9fa; 
    color: #333; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start; 
    min-height: 100vh; 
    margin: 0; 
    padding: 20px 0; 
    font-family: 'Apple SD Gothic Neo', sans-serif; 
}

.main-title { 
    font-size: 16px; 
    letter-spacing: 2px; 
    margin-bottom: 10px; 
    color: #222; 
    font-weight: 300; 
}

/* 탭 전환 버튼 스타일 */
.tab-btn {
    background: #222;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 25px;
    transition: background 0.2s;
    font-weight: 500;
}
.tab-btn:hover {
    background: #555;
}

/* 페이지 컨테이너 기본은 숨김 */
.page-container {
    display: none;
    width: 95%;
    max-width: 1200px;
}
/* 활성화된 페이지만 표시 */
.page-container.active {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card { 
    padding: 15px 20px; 
    border-radius: 12px; 
    background: #fff; 
    display: flex; 
    flex-direction: column; 
    text-align: left; 
    box-shadow: 0 5px 20px rgba(0,0,0,0.04); 
    border: 1px solid #eee; 
}

.title-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
h2 { font-size: 12px; letter-spacing: 1px; margin: 0; font-weight: 600; }

.badge-rainbow {
    font-size: 8px; font-weight: 800; color: #fff;
    padding: 3px 8px; border-radius: 4px;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #4cd964, #5ac8fa, #007aff, #5856d6, #ff2d55);
    background-size: 300% 300%;
    animation: rainbow-flow 4s linear infinite;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
}
@keyframes rainbow-flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

.card-pink h2 { color: #ff2d55; }
.card-blue h2 { color: #007aff; }
.card-purple h2 { color: #af52de; }
.card-orange h2 { color: #ff9500; }
.card-cyan h2 { color: #5ac8fa; }
.card-black-title h2 { color: #000; }

.song-item { margin: 8px 0; }
audio { width: 100%; height: 28px; outline: none; border-radius: 6px; filter: grayscale(1) contrast(1.2); opacity: 0.8; }
.song-name { font-size: 11px; margin-bottom: 5px; color: #666; font-weight: 500; display: flex; align-items: center; }
.song-name::before { content: '•'; margin-right: 6px; }
hr { border: 0; border-top: 1px solid #f0f0f0; margin: 5px 0; }
</style>
</head>
<body>

<h1 class="main-title">MY PRIVATE PLAYLIST</h1>

<!-- 페이지 전환 버튼 -->
<button class="tab-btn" id="toggleBtn" onclick="switchPage()">Switch to Page 1</button>

<!-- [시작 페이지] 새로운 2페이지 (birth.flac 적용) -->
<div class="page-container active" id="page2">
    <div class="card card-pink">
        <div class="title-wrapper">
            <h2>Birth Side A</h2>
            <span class="badge-rainbow">NEW</span>
        </div>
        <div class="song-item"><div class="song-name">birth.flac</div><audio src="birth.flac" controls loop></audio></div>
        <hr>
        <div class="song-item"><div class="song-name">birth2.mp3</div><audio src="birth2.mp3" controls loop></audio></div>
    </div>
    
    <div class="card card-blue">
        <div class="title-wrapper"><h2>Birth Side B</h2></div>
        <div class="song-item"><div class="song-name">birth3.mp3</div><audio src="birth3.mp3" controls loop></audio></div>
        <hr>
        <div class="song-item"><div class="song-name">birth4.flac</div><audio src="birth4.flac" controls loop></audio></div>
    </div>

    <div class="card card-purple">
        <div class="title-wrapper"><h2>Birth Side C</h2></div>
        <div class="song-item"><div class="song-name">birth5.mp3</div><audio src="birth5.mp3" controls loop></audio></div>
        <hr>
        <div class="song-item"><div class="song-name">birth6.flac</div><audio src="birth6.flac" controls loop></audio></div>
    </div>
</div>

<!-- 기존 1페이지 -->
<div class="page-container" id="page1">
    <div class="card card-pink"><div class="title-wrapper"><h2>Side A</h2></div><div class="song-item"><div class="song-name">music1.mp3</div><audio src="music1.mp3" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music2.mp3</div><audio src="music2.mp3" controls loop></audio></div></div>
    
    <div class="card card-blue"><div class="title-wrapper"><h2>Side B</h2></div><div class="song-item"><div class="song-name">music3.mp3</div><audio src="music3.mp3" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music4.flac</div><audio src="music4.flac" controls loop></audio></div></div>
    
    <div class="card card-purple"><div class="title-wrapper"><h2>Side C</h2></div><div class="song-item"><div class="song-name">music5.flac</div><audio src="music5.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music6.flac</div><audio src="music6.flac" controls loop></audio></div></div>

    <div class="card card-orange"><div class="title-wrapper"><h2>New Side A</h2></div><div class="song-item"><div class="song-name">music7.flac</div><audio src="music7.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music8.mp3</div><audio src="music8.mp3" controls loop></audio></div></div>
</div>

<script>
function switchPage() {
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const btn = document.getElementById('toggleBtn');

    if (page2.classList.contains('active')) {
        page2.classList.remove('active');
        page1.classList.add('active');
        btn.innerText = "Switch to Page 2 (Birth)";
    } else {
        page1.classList.remove('active');
        page2.classList.add('active');
        btn.innerText = "Switch to Page 1";
    }
}
</script>

</body>
</html>
