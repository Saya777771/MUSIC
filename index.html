<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Minimalist Playlist - Final Version</title>
    <style>
        body { 
            background: #f8f9fa; color: #333; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden; 
        }

        .main-title {
            font-size: 16px; letter-spacing: 2px; margin-bottom: 20px;
            color: #222; font-weight: 300;
        }

        .wrapper { 
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, auto);   
            gap: 15px; 
            width: 95%; 
            max-width: 1000px; 
        }

        .card { 
            padding: 15px 20px; 
            border-radius: 12px; background: #fff; 
            display: flex; flex-direction: column; text-align: left;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            border: 1px solid #eee;
        }

        /* 위치 지정 */
        .pos-left-1 { grid-column: 1; grid-row: 1; }
        .pos-left-2 { grid-column: 1; grid-row: 2; }
        .pos-left-3 { grid-column: 1; grid-row: 3; }
        .pos-center-1 { grid-column: 2; grid-row: 1; } 
        .pos-center-2 { grid-column: 2; grid-row: 2; }

        /* 타이틀 정렬 및 무지개 NEW 마크 스타일 */
        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        h2 { font-size: 12px; letter-spacing: 1px; margin: 0; font-weight: 600; }

        /* 무지개 NEW 뱃지 효과 */
        .badge-new {
            font-size: 9px;
            font-weight: 800;
            color: #fff;
            padding: 2px 6px;
            border-radius: 20px;
