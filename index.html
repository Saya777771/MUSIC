<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Minimalist Playlist - Final Version</title>
<style>
body { background: #f8f9fa; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
.main-title { font-size: 16px; letter-spacing: 2px; margin-bottom: 20px; color: #222; font-weight: 300; }
.wrapper { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto); gap: 15px; width: 95%; max-width: 1000px; }
.card { padding: 15px 20px; border-radius: 12px; background: #fff; display: flex; flex-direction: column; text-align: left; box-shadow: 0 5px 20px rgba(0,0,0,0.04); border: 1px solid #eee; }

.pos-left-1 { grid-column: 1; grid-row: 1; }
.pos-left-2 { grid-column: 1; grid-row: 2; }
.pos-left-3 { grid-column: 1; grid-row: 3; }
.pos-center-1 { grid-column: 2; grid-row: 1; }
.pos-center-2 { grid-column: 2; grid-row: 2; }
.pos-center-3 { grid-column: 2; grid-row: 3; }
.pos-right-1 { grid-column: 3; grid-row: 1; } 
.pos-right-2 { grid-column: 3; grid-row: 2; }

.title-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
h2 { font-size: 12px; letter-spacing: 1px; margin: 0; font-weight: 600; }

.badge-rainbow {
    font-size: 8px; font-weight: 800; color: #fff;
    padding: 3px 8px; border-radius: 4px;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #4cd964, #5ac8fa, #007aff, #5856d6, #ff2d55);
    background-size: 300% 300%;
    animation: rainbow-flow 4s linear infinite;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
}
@keyframes rainbow-flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

.card-pink h2 { color: #ff2d55; }
.card-blue h2 { color: #007aff; }
.card-purple h2 { color: #af52de; }
.card-orange h2 { color: #ff9500; }
.card-cyan h2 { color: #5ac8fa; }
.card-black-title h2 { color: #000; }

.song-item { margin: 8px 0; }
audio { width: 100%; height: 28px; outline: none; border-radius: 6px; filter: grayscale(1) contrast(1.2); opacity: 0.8; }
.song-name { font-size: 11px; margin-bottom: 5px; color: #666; font-weight: 500; display: flex; align-items: center; }
.song-name::before { content: '•'; margin-right: 6px; }
hr { border: 0; border-top: 1px solid #f0f0f0; margin: 5px 0; }
</style>
</head>
<body>

<h1 class="main-title">MY PRIVATE PLAYLIST</h1>

<div class="wrapper">
    <div class="card card-pink pos-left-1"><div class="title-wrapper"><h2>Side A</h2></div><div class="song-item"><div class="song-name">music1.mp3</div><audio src="music1.mp3" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music2.mp3</div><audio src="music2.mp3" controls loop></audio></div></div>
    <div class="card card-blue pos-left-2"><div class="title-wrapper"><h2>Side B</h2></div><div class="song-item"><div class="song-name">music3.mp3</div><audio src="music3.mp3" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music4.flac</div><audio src="music4.flac" controls loop></audio></div></div>
    <div class="card card-purple pos-left-3"><div class="title-wrapper"><h2>Side C</h2></div><div class="song-item"><div class="song-name">music5.flac</div><audio src="music5.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music6.flac</div><audio src="music6.flac" controls loop></audio></div></div>

    <div class="card card-orange pos-center-1"><div class="title-wrapper"><h2>New Side A</h2></div><div class="song-item"><div class="song-name">music7.flac</div><audio src="music7.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music8.mp3</div><audio src="music8.mp3" controls loop></audio></div></div>
    <div class="card card-cyan pos-center-2"><div class="title-wrapper"><h2>New Side B</h2></div><div class="song-item"><div class="song-name">music9.flac</div><audio src="music9.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music10.flac</div><audio src="music10.flac" controls loop></audio></div></div>
    <div class="card card-black-title pos-center-3"><div class="title-wrapper"><h2>New Side C</h2></div><div class="song-item"><div class="song-name">music11.flac</div><audio src="music11.flac" controls loop></audio></div><hr><div class="song-item"><div class="song-name">music12.mp3</div><audio src="music12.mp3" controls loop></audio></div></div>

    <div class="card card-pink pos-right-1">
        <div class="title-wrapper">
            <h2>Next Side A</h2>
        </div>
        <div class="song-item">
            <div class="song-name">music13.flac</div>
            <audio src="music13.flac" controls loop></audio>
        </div>
        <hr>
        <div class="song-item">
            <div class="song-name">music14.mp3</div>
            <audio src="music14.mp3" controls loop></audio>
        </div>
    </div>

    <div class="card card-blue pos-right-2">
        <div class="title-wrapper">
            <h2>Next Side B</h2>
            <span class="badge-rainbow">NEW</span>
        </div>
        <div class="song-item">
            <div class="song-name">music15.mp3</div>
            <audio src="music15.mp3" controls loop></audio>
        </div>
    </div>
</div>

</body>
</html>
